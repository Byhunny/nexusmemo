[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusmemory"
version = "0.1.0"
description = "Local-first AI memory layer that gives LLMs persistent, structured memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Byhunny", email = "tansusam91@gmail.com" }]
keywords = ["ai", "memory", "llm", "mcp", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.30.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "mcp[cli]>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Byhunny/nexusmemory"
Repository = "https://github.com/Byhunny/nexusmemory"
Issues = "https://github.com/Byhunny/nexusmemory/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
local-embeddings = ["sentence-transformers>=3.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
nexusmemory = "nexusmemory.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusmemory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
